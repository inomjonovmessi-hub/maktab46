{% load static %}
<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>{% block title %}46-maktab | Ta'lim maskani{% endblock %}</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("maktab46-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : preferredTheme;
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav class="site-nav" aria-label="Asosiy menyu">
    <div class="nav-inner mx-auto max-w-7xl px-5 py-3">
      <a href="#bosh-sahifa" class="nav-brand flex items-center gap-3 text-sm font-black tracking-[.08em]">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl border border-sky-400/20 bg-sky-400/10 text-sky-500" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 10h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span>46-MAKTAB — TA'LIM MASKANI</span>
      </a>
      <div class="nav-links text-sm">
        <a href="#bosh-sahifa" class="nav-link">Bosh sahifa</a>
        <a href="#iqtidorlilar" class="nav-link">Iqtidorlilar</a>
        <a href="#hujjatlar" class="nav-link">Qabul hujjatlari</a>
        <a href="#kutubxona" class="nav-link">Kutubxona</a>
        <a href="#ustozlar" class="nav-link">Ustozlar</a>
        <a href="#galereya" class="nav-link">Galereya</a>
        <a href="#murojaat" class="nav-link">Murojaat</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Rang rejimini o'zgartirish" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <a href="#ariza" class="button nav-action rounded-xl">Ariza topshirish</a>
      </div>
    </div>
  </nav>
  {% block content %}{% endblock %}
  <script src="{% static 'js/theme-gallery.js' %}" defer></script>
</body>
</html>
